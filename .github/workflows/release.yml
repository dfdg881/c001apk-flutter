name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          cache: true

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "temurin"

      - name: 从 pubspec.yaml 获取版本号
        id: version
        run: |
          # 提取 version: 后面的内容，例如 "1.0.0+1"
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          # 去掉 + 后面的 build number，作为 Release 版本
          RELEASE_VERSION=$(echo "$VERSION" | cut -d'+' -f1)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_OUTPUT
          echo "完整版本: $VERSION"
          echo "发布版本: $RELEASE_VERSION"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-ARM64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload ARM32 APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-ARM32
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: Upload x86-64 APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-x86-64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.RELEASE_VERSION }}
          name: Release v${{ steps.version.outputs.RELEASE_VERSION }}
          body: |
            自动构建的 Android APK 发布
            完整版本: ${{ steps.version.outputs.VERSION }}
            构建时间: ${{ github.event.repository.updated_at }}
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
